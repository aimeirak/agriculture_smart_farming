<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Farmer</title>
</head>
<body>
    <h1>Delete Farmer</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ farmer.first_name }} {{ farmer.last_name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'farmer_detail' farmer.pk %}">Cancel</a>
    </form>
</body>
</html>
